# Publishes the reader plus the demo vault to GitHub Pages.
#
# The site is assembled here rather than committed: web/ is the app exactly as
# anyone would deploy it, and demo/data/ holds a vault encrypted with the
# password "demo". Nothing secret is involved -- the demo vault is ciphertext of
# sample text, and its password is printed in the README on purpose.
name: Deploy demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r web/. _site/
          rm -f _site/data/.gitkeep
          mkdir -p _site/data
          cp -r demo/data/. _site/data/
          test -f _site/index.html
          test -f _site/data/vault.enc
          echo "Site contents:"
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
